name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 0 */5 * *'  # 每 5 天執行一次
  workflow_dispatch:        # 也可手動觸發

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s -o /dev/null -w "HTTP %{http_code}" \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/company_settings?select=id&limit=1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}"
          echo " → Supabase pinged OK"
